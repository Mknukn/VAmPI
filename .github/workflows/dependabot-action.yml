name: Dependabot Alerts to DefectDojo

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  DD_URL: http://10.40.40.101:8080
  PRODUCT_NAME: "VAmPI"
  ENGAGEMENT_NAME: "CI Scans"

jobs:
  import-dependabot:
    runs-on: self-hosted
    steps:
      - name: Fetch Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GH_SECURITY_PAT }}
        run: |
          gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                vulnerabilityAlerts(first: 100, states: OPEN) {
                  nodes {
                    createdAt
                    vulnerableManifestPath
                    securityVulnerability {
                      severity
                      package { name ecosystem }
                      advisory { summary identifiers { value type } }
                    }
                  }
                }
              }
            }' -f owner="${{ github.repository_owner }}" -f name="$(basename ${{ github.repository }})" > dependabot-alerts.json

      - name: Reimport to DefectDojo
        run: |
          curl -sS -X POST "$DD_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Github Vulnerability Scan" \
            -F "file=@dependabot-alerts.json" \
            -F "product_name=$PRODUCT_NAME" \
            -F "engagement_name=$ENGAGEMENT_NAME" \
            -F "test_title=Dependabot - VAmPI" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
