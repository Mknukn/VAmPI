name: VAmPI Security Scans

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DD_URL: http://10.40.40.102:8080
  PRODUCT_NAME: "API Platform"
  ENGAGEMENT_NAME: "CI Scans"

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep
        run: semgrep scan --config auto --json --output semgrep-results.json .
        continue-on-error: true

      - name: Bandit
        env:
            PYTHONWARNINGS: "ignore::SyntaxWarning"
        run: bandit -r . -f json -o bandit-results.json
        continue-on-error: true

      - name: Trufflehog
        run: |
          trufflehog filesystem . --json --no-update > trufflehog-results.json
        continue-on-error: true

      - name: Build VAmPI image
        run: docker build -t vampi:ci .

      - name: Trivy (image scan)
        run: trivy image --format json --output trivy-results.json vampi:ci
        continue-on-error: true

      - name: Cleanup image
        if: always()
        run: docker rmi vampi:ci || true

      - name: Reimport to DefectDojo
        run: |
          reimport() {
            curl -sS -X POST "$DD_URL/api/v2/reimport-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -F "scan_type=$1" \
              -F "file=@$2" \
              -F "product_name=$PRODUCT_NAME" \
              -F "engagement_name=$ENGAGEMENT_NAME" \
              -F "test_title=$3" \
              -F "auto_create_context=true" \
              -F "close_old_findings=true"
          }
          reimport "Semgrep JSON Report" semgrep-results.json "Semgrep - VAmPI"
          reimport "Bandit Scan" bandit-results.json "Bandit - VAmPI"
          reimport "Trufflehog Scan" trufflehog-results.json "Trufflehog - VAmPI"
          reimport "Trivy Scan" trivy-results.json "Trivy - VAmPI"
